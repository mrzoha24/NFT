<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Username Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--text:#0f1b2d;--mut:#66748a;--acc:#6d4aff;--accT:#fff;--line:#dfe5f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#161f33;--text:#eaf0f8;--mut:#92a2bb;--acc:#8d74ff;--accT:#10062e;--line:#243150;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#161f33;--text:#eaf0f8;--mut:#92a2bb;--acc:#8d74ff;--accT:#10062e;--line:#243150;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button:active,.buy:active,.tile:active,.cta:active{transform:scale(.95)}
a{color:inherit;text-decoration:none;transition:transform .15s ease}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;font-weight:700;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px}
main{flex:1;overflow-y:auto;padding:0 16px 18px;scroll-behavior:smooth}
.in{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:14px;transition:border-color .2s}
.search:focus{border-color:var(--acc);outline:none}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px 20px;color:#fff;background:linear-gradient(135deg,#7c3aed 0%,#2563eb 58%,#06b6d4 100%);margin-bottom:20px;box-shadow:0 14px 30px -12px rgba(76,29,149,.55)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,rgba(236,72,153,.6),transparent 52%);pointer-events:none}
.hero>*{position:relative}
.badge{display:inline-block;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:14px}
.hero h2{font-size:26px;line-height:1.15;margin:0 0 10px}
.hero p{font-size:14px;line-height:1.5;opacity:.93}
.fl{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap}
.fl span{background:#fff;color:#3b1d8f;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.fl span:nth-child(1){transform:rotate(-4deg)}
.fl span:nth-child(2){transform:rotate(2deg) translateY(4px)}
.fl span:nth-child(3){transform:rotate(-2deg)}
.hs{display:flex;gap:22px;font-size:12px;opacity:.95}
.hs b{display:block;font-size:20px}
.cta{margin-top:18px;background:#fff;color:#4c1d95;border-radius:13px;padding:12px 20px;font-weight:700;font-size:14px}
h2.sec{font-size:16px;margin:2px 0 12px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.tile{aspect-ratio:1;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:23px;box-shadow:0 6px 12px -8px var(--c2)}
.tile small{font-size:10px;font-weight:500;opacity:.95}
.tile i{font-style:normal;font-size:19px}
.sub{font-size:13px;color:var(--mut);margin:-2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;border-radius:16px;padding:34px 8px 8px;text-align:center;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 8px 16px -10px var(--c2)}
.un{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.heart{position:absolute;top:4px;right:4px;width:34px;height:34px;font-size:20px;color:#fff;opacity:.85}
.heart.on{opacity:1;text-shadow:0 0 8px rgba(255,255,255,.9)}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.45)}100%{transform:scale(1)}}
.acts{display:flex;gap:6px}
.buy{flex:1;background:#fff;color:var(--c2);border-radius:10px;padding:9px 4px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap}
.cart{width:34px;background:rgba(255,255,255,.26);border-radius:10px;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:44px 10px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.row b{flex:1;font-size:16px}
.row .buy{flex:none;background:var(--acc);color:var(--accT);padding:10px 14px;font-size:12px}
.x{width:30px;height:30px;color:var(--mut);font-size:18px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line)}
nav button{padding:8px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{font-size:18px;line-height:1;padding:4px 16px;border-radius:14px;transition:background .2s,color .2s}
nav button.on{color:var(--acc);font-weight:700}
nav button.on span{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.prof{text-align:center;padding-top:20px}
.av{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mut)}
.pbtn{background:var(--acc);color:var(--accT);border-radius:12px;padding:11px 20px;font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<!-- Sample data. In the real app this comes from usernames.json on GitHub. -->

</script>

<script>
// Real app: set this to your raw GitHub link, e.g.
// https://raw.githubusercontent.com/YOURNAME/YOURREPO/main/usernames.json
const DATA_URL="usernames.json";
const ICONS={Bank:"🏦",Shop:"🛍️",Bird:"🐦",Others:"✨"};
const GR=[["#ef5350","#c62828"],["#ab47bc","#6a1b9a"],["#5c6bc0","#283593"],["#039be5","#01579b"],["#26a69a","#00695c"],["#43a047","#1b5e20"],["#fb8c00","#e65100"],["#ec407a","#ad1457"]];
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const $=s=>document.querySelector(s);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const LET=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
let DATA={},KEYS=[],ALL=[];
const S={tab:"home",cat:null,q:"",wish:new Set(),cart:new Set()};

async function load(){
  try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}
  catch(e){return JSON.parse($("#data").textContent)}
}
const clean=a=>[...new Set((Array.isArray(a)?a:String(a||"").split(/[\s,]+/)).map(n=>String(n).toLowerCase().replace(/[^a-z0-9_]/g,"")).filter(Boolean))];

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
const furl=n=>"https://fragment.com/username/"+n;
function card(n){
  const [c1,c2]=GR[hash(n)%GR.length],w=S.wish.has(n);
  return `<div class="card" style="--c1:${c1};--c2:${c2}"><button class="heart ${w?'on':''}" data-w="${n}" aria-label="Wishlist">${w?'♥':'♡'}</button><div class="un">${n}</div><div class="acts"><a class="buy" href="${furl(n)}" target="_blank" rel="noopener" data-f="1">Buy Now</a><button class="cart" data-a="${n}" aria-label="Add to cart">🛒</button></div></div>`;
}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">Nothing here yet.</div>`;

function hero(){
  const n=ALL.length,pick=[ALL[0],ALL[Math.floor(n/3)],ALL[Math.floor(2*n/3)]].filter(Boolean);
  return `<section class="hero"><span class="badge">Premium NFT collection</span><h2>Rare Telegram usernames, picked to be remembered</h2><p>Short, sharp five-letter names that are yours to own. Find the one that fits you, save it, and buy it on Fragment.</p><div class="fl">${pick.map(x=>`<span>@${x}</span>`).join("")}</div><div class="hs"><div><b>${n}</b>usernames</div><div><b>${KEYS.length}</b>series</div></div><button class="cta" data-go="1">Browse A to Z</button></section>`;
}

function render(anim){
  const hd=$("#hd"),m=$("#main");
  let title="Username Shop",body="";
  if(S.tab==="home"){
    if(S.cat){title=S.cat.length===1?S.cat+" series":S.cat;body=`<div class="sub">${(DATA[S.cat]||[]).length} usernames</div>`+grid(DATA[S.cat]||[])}
    else if(S.q){title="Search";body=grid(ALL.filter(n=>n.includes(S.q.toLowerCase())))}
    else{
      const sp=KEYS.filter(k=>k.length>1),t=(k,i)=>{const g=GR[i%GR.length];return `style="--c1:${g[0]};--c2:${g[1]}"`};
      body=hero()+`<h2 class="sec" id="az">Browse A to Z</h2><div class="cats">${LET.map((l,i)=>`<button class="tile" ${t(l,i)} data-c="${l}">${l}</button>`).join("")}${sp.map((k,i)=>`<button class="tile" ${t(k,i+3)} data-c="${k}"><i>${ICONS[k]||"🔖"}</i><small>${k}</small></button>`).join("")}</div>`;
    }
  }else if(S.tab==="wish"){title="Wishlist";body=S.wish.size?grid([...S.wish]):`<div class="empty">Tap the heart on a username to save it here.</div>`}
  else if(S.tab==="cart"){title="Cart";body=S.cart.size?[...S.cart].map(n=>`<div class="row"><b>@${n}</b><a class="buy" href="${furl(n)}" target="_blank" rel="noopener" data-f="1">Buy Now</a><button class="x" data-r="${n}" aria-label="Remove">×</button></div>`).join(""):`<div class="empty">Tap the cart on a username to add it here.</div>`}
  else{title="Profile";body=`<div class="prof"><div class="av">U</div><b>Guest</b><div class="stats"><div><b>${S.wish.size}</b><span>Wishlist</span></div><div><b>${S.cart.size}</b><span>In cart</span></div></div><button class="pbtn" id="th">Switch light or dark</button></div>`}
  hd.innerHTML=(S.tab==="home"&&(S.cat||S.q)?`<button class="back" id="bk" aria-label="Back">‹</button>`:"")+`<h1>${title}</h1>`;
  if(S.tab==="home"&&!S.cat)body=`<input class="search" id="q" placeholder="Search a username" value="${S.q}">`+body;
  const keep=m.scrollTop;
  m.innerHTML=body;
  if(anim){m.style.scrollBehavior="auto";m.scrollTop=0;m.style.scrollBehavior="";m.classList.remove("in");void m.offsetWidth;m.classList.add("in")}
  else{m.style.scrollBehavior="auto";m.scrollTop=keep;m.style.scrollBehavior=""}
  $("#nav").innerHTML=[["home","🏠","Home"],["wish","♡","Wishlist"],["cart","🛒","Cart"],["me","👤","Profile"]].map(t=>`<button class="${S.tab===t[0]?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");
  const q=$("#q");if(q&&S.q){q.focus();q.setSelectionRange(S.q.length,S.q.length)}
}
document.addEventListener("click",e=>{
  const g=a=>e.target.closest("["+a+"]");let x;
  if(x=g("data-f")){if(tg&&tg.openLink){e.preventDefault();tg.openLink(x.href)}}
  else if(x=g("data-go")){$("#az").scrollIntoView({behavior:"smooth",block:"start"})}
  else if(x=g("data-t")){S.tab=x.dataset.t;S.cat=null;S.q="";render(true)}
  else if(x=g("data-c")){S.cat=x.dataset.c;render(true)}
  else if(x=g("data-w")){const n=x.dataset.w;S.wish.has(n)?S.wish.delete(n):S.wish.add(n);render(false);if(S.wish.has(n)){const b=document.querySelector('[data-w="'+n+'"]');if(b)b.classList.add("pop")}}
  else if(x=g("data-a")){S.cart.add(x.dataset.a);S.tab="cart";S.cat=null;S.q="";render(true);toast("@"+x.dataset.a+" added to cart")}
  else if(x=g("data-r")){S.cart.delete(x.dataset.r);render(false)}
  else if(e.target.closest("#bk")){S.cat=null;S.q="";render(true)}
  else if(e.target.closest("#th")){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim();render(false)}});

load().then(raw=>{
  LET.forEach(l=>{DATA[l]=clean(raw[l])});
  Object.keys(raw).filter(k=>!/^[A-Z]$/.test(k)).forEach(k=>{DATA[k]=clean(raw[k])});
  KEYS=Object.keys(DATA);
  ALL=[...new Set(Object.values(DATA).flat())];
  render(true);
});
</script>
</body>
</html>
