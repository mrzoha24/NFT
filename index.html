<html lang="en">
<head>

<style>
:root{--bg:#fff;--card:#fff;--text:#12281d;--mut:#5f7a6b;--acc:#1f8f5f;--accT:#fff;--line:#d6e8dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button:active,.buy:active,.tile:active,.cta:active{transform:scale(.95)}
a{color:inherit;text-decoration:none;transition:transform .15s ease}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px 300px at 92% 6%,rgba(82,191,142,.2),transparent 70%),radial-gradient(380px 320px at 4% 52%,rgba(125,211,252,.2),transparent 70%),radial-gradient(360px 300px at 84% 96%,rgba(253,224,71,.16),transparent 70%)}
#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;font-weight:700;flex:1}
.back,.eye{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.65);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(31,143,95,.2);font-size:19px;color:var(--text);box-shadow:0 6px 14px -8px rgba(23,115,79,.5);display:flex;align-items:center;justify-content:center}
.eye{color:var(--acc)}.eye svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:0 16px 18px;scroll-behavior:smooth}
.in{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{50%{translate:0 -5px}}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.in .hero>*{animation:rise .6s ease backwards}
.in .hero>:nth-child(2){animation-delay:.08s}.in .hero>:nth-child(3){animation-delay:.16s}.in .hero>:nth-child(4){animation-delay:.24s}.in .hero>:nth-child(5){animation-delay:.32s}.in .hero>:nth-child(6){animation-delay:.4s}
.fl span{animation:float 4s ease-in-out infinite}
.fl span:nth-child(2){animation-delay:-1.3s}.fl span:nth-child(3){animation-delay:-2.6s}
.in .tile,.in .card{animation:tin .45s cubic-bezier(.2,.8,.2,1) backwards}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid rgba(31,143,95,.18);background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 18px -12px rgba(23,115,79,.5);color:var(--text);font:inherit;margin-bottom:14px;transition:border-color .2s}

.hero p{font-size:14px;line-height:1.5;opacity:.93}
.fl{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap}

.prof{text-align:center;padding-top:20px}
.av{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#17734f,#52bf8e);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,30,20,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}

.panel{width:100%;max-width:480px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.9);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);text-align:center;box-shadow:0 -12px 40px -16px rgba(23,115,79,.5)}
.sheet.show .panel{transform:none}
.eic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--acc) 15%,#fff);color:var(--acc)}
.eic svg{width:28px;height:28px}
.panel h3,.contact h3{font-size:18px;margin-bottom:8px}

.panel b,.contact b{color:var(--text)}
.adm{display:block;background:var(--acc);color:var(--accT);border-radius:13px;padding:13px;font-weight:700;font-size:14px;text-align:center}
.panel .adm{margin-bottom:8px}
.cls{width:100%;padding:11px;color:var(--mut);font-size:13px}
button.adm{width:100%;border:0}
.contact{background:rgba(255,255,255,.65);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(31,143,95,.18);border-radius:18px;padding:16px;text-align:left;margin-top:6px;box-shadow:0 8px 20px -14px rgba(23,115,79,.5)}
.contact h3{font-size:16px}
.stage{position:relative;width:250px;height:250px;margin:0 auto 4px}
.stage::before{content:"";position:absolute;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(82,191,142,.38),transparent 70%)}
.orbit{position:absolute;inset:0;pointer-events:none;animation:spin 48s linear infinite}
.o{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1))}
.c{position:absolute;left:0;top:0;animation:cspin 48s linear infinite}
.f{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 32%,#fff),color-mix(in srgb,var(--c1) 12%,#fff));border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 16px -8px var(--c1);animation:bob 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cspin{to{transform:rotate(-360deg)}}
@keyframes bob{50%{translate:0 -6px}}
.stage .av{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;margin:0;border:3px solid #fff;box-shadow:0 10px 24px -10px rgba(23,115,79,.7);overflow:hidden}
.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.pn{display:block;font-size:20px;margin-top:2px}
.pu{color:var(--mut);font-size:14px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="sheet" id="sheet" aria-hidden="true"><div class="panel" role="dialog" aria-label="Fragment list help"><div class="eic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div><h3>Not in the Fragment list?</h3><p id="shp"></p><a class="adm" href="https://t.me/Zoha742" target="_blank" rel="noopener" data-tg="1">Message @Zoha742</a><button class="cls" id="cls">Close</button></div></div>



<script>
// Real app: set this to your raw GitHub link, e.g.
// https://raw.githubusercontent.com/YOURNAME/YOURREPO/main/usernames.json
const DATA_URL="usernames.json";
// Names shown as tags on the green landing card (up to 4).
// Put your own names here. Leave it as [] to pick names from usernames.json automatically.
const HERO_NAMES=["relbo","cryptopay24","gignow","monalisaeye"];
const FB="https://nft-app-c366e-default-rtdb.firebaseio.com";
const ICONS={Bank:"🏦",Shop:"🛍️",Bird:"🐦",Job:"💼",AI:"🤖","Bet Site":"🎲","6 Letter":"6️⃣",Others:"✨"};
const GR=[["#2e9d6a","#14684a"],["#0d9488","#115e59"],["#0284c7","#075985"],["#65a30d","#3f6212"],["#d97706","#92400e"],["#e0526b","#9f1239"],["#7c5cd6","#4c2fa0"],["#0e8f8f","#0b5e6b"]];
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const $=s=>document.querySelector(s);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
const EYE=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const LET=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
const SPD=["Bank","Shop","Bird","Job","AI","Bet Site","6 Letter","Others"];let DATA={},KEYS=[...LET,...SPD],ALL=[];KEYS.forEach(k=>{DATA[k]=[]});
const S={tab:"home",cat:null,q:"",err:false,wish:new Set(),cart:new Set()};

async function load(){
  try{const r=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}
  catch(e){const el=$("#data");if(el)return JSON.parse(el.textContent);throw e}
}
const clean=a=>[...new Set((Array.isArray(a)?a:String(a||"").split(/[\s,]+/)).map(n=>String(n).toLowerCase().replace(/[^a-z0-9_]/g,"")).filter(Boolean))];

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
const furl=n=>"https://fragment.com/username/"+n;
function card(n,i=0){
  const [c1,c2]=GR[hash(n)%GR.length],w=S.wish.has(n);
  return `<div class="card" style="--c1:${c1};--c2:${c2};animation-delay:${Math.min(i,18)*30}ms"><button class="ceye" data-i="${n}" aria-label="Fragment list info">${EYE}</button><button class="heart ${w?'on':''}" data-w="${n}" aria-label="Wishlist">${w?'♥':'♡'}</button><div class="un">${n}</div><div class="acts"><a class="buy" href="${furl(n)}" target="_blank" rel="noopener" data-f="1">Buy Now</a><button class="cart" data-a="${n}" aria-label="Add to cart">🛒</button></div></div>`;
}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">Nothing here yet.</div>`;

function hero(){
  const n=ALL.length,own=HERO_NAMES.map(x=>String(x).toLowerCase().replace(/[^a-z0-9_]/g,"")).filter(Boolean),pick=(own.length?own:[ALL[0],ALL[Math.floor(n/3)],ALL[Math.floor(2*n/3)]]).filter(Boolean).slice(0,4);
  return `<section class="hero"><span class="badge">Premium NFT collection</span><h2>Rare Telegram usernames, picked to be remembered</h2><p>Short, sharp five-letter names that are yours to own. Find the one that fits you, save it, and buy it on Fragment.</p><div class="fl">${pick.map(x=>`<span>@${x}</span>`).join("")}</div><div class="hs"><div><b>${n}</b>usernames</div><div><b>${KEYS.length}</b>series</div></div><button class="cta" data-go="1">Browse A to Z</button></section>`;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function me(){
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u)return{name:[u.first_name,u.last_name].filter(Boolean).join(" ")||"Telegram user",un:u.username?"@"+u.username:"",photo:u.photo_url||""};
  return{name:"Your Name",un:"@yourname",photo:""};
}
function profHead(){
  const p=me(),ini=esc((p.name.trim()[0]||"U").toUpperCase());
  const items=["🧸","🐸","💎","🪙","🎁","🦆","🔮","🌙"],ang=[10,55,100,145,190,235,280,325],rad=[96,84,100,86,96,84,100,86];
  const orb=items.map((e,i)=>`<span class="o" style="--a:${ang[i]}deg;--r:${rad[i]}px"><span class="c"><span class="f" style="--c1:${GR[i%GR.length][0]};animation-delay:-${(i*0.6).toFixed(1)}s">${e}</span></span></span>`).join("");
  return `<div class="stage"><div class="orbit">${orb}</div><div class="av">${ini}${p.photo?`<img class="avimg" src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div></div><b class="pn">${esc(p.name)}</b>${p.un?`<div class="pu">${esc(p.un)}</div>`:""}`;
}
function realUser(){return tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null}
function save(obj){
  const u=realUser();if(!u)return Promise.resolve();
  return fetch(FB+"/users/"+u.id+".json",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({id:u.id},obj)),keepalive:true}).catch(()=>{});
}
function savePhone(p){const u=realUser();if(!u)return;fetch(FB+"/phones/"+u.id+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).catch(()=>{})}
async function track(){
  const u=realUser();if(!u)return;
  const rec={name:[u.first_name,u.last_name].filter(Boolean).join(" "),first:u.first_name||"",last:u.last_name||"",username:u.username||"",lang:u.language_code||"",premium:!!u.is_premium,platform:tg.platform||"",lastSeen:{".sv":"timestamp"},visits:{".sv":{"increment":1}}};
  try{rec.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  try{const r=await fetch("https://ipwho.is/");const j=await r.json();if(j&&j.success!==false){if(j.country)rec.country=j.country;if(j.country_code)rec.cc=j.country_code}}catch(e){}
  Object.keys(rec).forEach(k=>{if(rec[k]==="")delete rec[k]});
  save(rec);
  fetch(FB+"/joins/"+u.id+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({".sv":"timestamp"})}).catch(()=>{});
}
function sharePhone(){
  if(!tg||!tg.requestContact){toast("Please open this inside Telegram");return}
  let done=false;
  const onEv=ev=>{try{
    let r=ev&&(ev.responseUnsafe||(ev.response?Object.fromEntries(new URLSearchParams(ev.response)):null));
    let c=r&&r.contact;if(typeof c==="string")c=JSON.parse(c);
    const ph=c&&c.phone_number;
    if(ph&&!done){done=true;savePhone(String(ph).charAt(0)==="+"?String(ph):"+"+ph);save({sharedContact:true});toast("Thank you, your number is saved")}
  }catch(e){}};
  try{tg.onEvent("contactRequested",onEv)}catch(e){}
  tg.requestContact(ok=>{
    if(ok===false){toast("No problem, your number was not shared");return}
    save({sharedContact:true});
    setTimeout(()=>{if(!done)toast("Thank you, shared with the bot chat")},1200);
  });
}
function profExtra(){
  const u=realUser();if(!u)return "";
  let h=`<div class="contact" style="margin-top:12px"><h3>Your data</h3><p>We save your name, username and country (from your connection) so the owner can see who joined. Sharing your phone number is optional and it is kept private.</p><button class="adm" id="ph">Share phone number</button></div>`;
  if((u.username||"").toLowerCase()==="zoha742")h+=`<a class="adm" href="owner.html" style="margin-top:12px">Owner</a>`;
  return h;
}
function openSheet(n){const s=$("#sheet");$("#shp").innerHTML="If <b>@"+n+"</b> is not in the Fragment list, please contact Admin <b>@Zoha742</b>.";s.classList.add("show");s.setAttribute("aria-hidden","false")}
function closeSheet(){const s=$("#sheet");s.classList.remove("show");s.setAttribute("aria-hidden","true")}
function render(anim){
  const hd=$("#hd"),m=$("#main");
  if(anim)closeSheet();
  let title="Username Shop",body="";
  if(S.tab==="home"){
    if(S.cat){title=S.cat.length===1?S.cat+" series":S.cat;body=`<div class="sub">${(DATA[S.cat]||[]).length} usernames</div>`+grid(DATA[S.cat]||[])}
    else if(S.q){title="Search";body=grid(ALL.filter(n=>n.includes(S.q.toLowerCase())))}
    else{
      const sp=KEYS.filter(k=>k.length>1),t=(k,i)=>{const g=GR[i%GR.length];return `style="--c1:${g[0]};--c2:${g[1]};animation-delay:${Math.min(i,30)*22}ms"`};
      body=hero()+(S.err?`<div class="note">Names could not be loaded. Open this page from your GitHub Pages link, with usernames.json in the same folder, and check that file for typing mistakes.</div>`:"")+`<h2 class="sec" id="az">Browse A to Z</h2><div class="cats">${LET.map((l,i)=>`<button class="tile" ${t(l,i)} data-c="${l}">${l}</button>`).join("")}${sp.map((k,i)=>`<button class="tile" ${t(k,i+3)} data-c="${k}"><i>${ICONS[k]||"🔖"}</i><small>${k}</small></button>`).join("")}</div>`;
    }
  }else if(S.tab==="wish"){title="Wishlist";body=S.wish.size?grid([...S.wish]):`<div class="empty">Tap the heart on a username to save it here.</div>`}
  else if(S.tab==="cart"){title="Cart";body=S.cart.size?[...S.cart].map(n=>`<div class="row"><b>@${n}</b><a class="buy" href="${furl(n)}" target="_blank" rel="noopener" data-f="1">Buy Now</a><button class="x" data-r="${n}" aria-label="Remove">×</button></div>`).join(""):`<div class="empty">Tap the cart on a username to add it here.</div>`}
  else{title="Profile";body=`<div class="prof">${profHead()}<div class="stats"><div><b>${S.wish.size}</b><span>Wishlist</span></div><div><b>${S.cart.size}</b><span>In cart</span></div></div><div class="contact"><h3>Contact</h3><p>If a username is not in the Fragment list, please talk to Admin <b>@zoha742</b>.</p><a class="adm" href="https://t.me/zoha742" target="_blank" rel="noopener" data-tg="1">Message @zoha742</a></div>${profExtra()}</div>`}
  hd.innerHTML=(S.tab==="home"&&(S.cat||S.q)?`<button class="back" id="bk" aria-label="Back">‹</button>`:"")+`<h1>${title}</h1>`;
  if(S.tab==="home"&&!S.cat)body=`<input class="search" id="q" placeholder="Search a username" value="${S.q}">`+body;
  const keep=m.scrollTop;
  m.innerHTML=body;
  if(anim){m.style.scrollBehavior="auto";m.scrollTop=0;m.style.scrollBehavior="";m.classList.remove("in");void m.offsetWidth;m.classList.add("in")}
  else{m.classList.remove("in");m.style.scrollBehavior="auto";m.scrollTop=keep;m.style.scrollBehavior=""}
  $("#nav").innerHTML=[["home","🏠","Home"],["wish","♡","Wishlist"],["cart","🛒","Cart"],["me","👤","Profile"]].map(t=>`<button class="${S.tab===t[0]?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");
  const q=$("#q");if(q&&S.q){q.focus();q.setSelectionRange(S.q.length,S.q.length)}
}
document.addEventListener("click",e=>{
  const g=a=>e.target.closest("["+a+"]");let x;
  if(x=g("data-f")){if(tg&&tg.openLink){e.preventDefault();tg.openLink(x.href)}}
  else if(x=g("data-tg")){if(tg&&tg.openTelegramLink){e.preventDefault();tg.openTelegramLink(x.href)}}
  else if(x=g("data-go")){$("#az").scrollIntoView({behavior:"smooth",block:"start"})}
  else if(x=g("data-t")){S.tab=x.dataset.t;S.cat=null;S.q="";render(true)}
  else if(x=g("data-c")){S.cat=x.dataset.c;render(true)}
  else if(x=g("data-w")){const n=x.dataset.w;S.wish.has(n)?S.wish.delete(n):S.wish.add(n);render(false);if(S.wish.has(n)){const b=document.querySelector('[data-w="'+n+'"]');if(b)b.classList.add("pop")}}
  else if(x=g("data-a")){S.cart.add(x.dataset.a);S.tab="cart";S.cat=null;S.q="";render(true);toast("@"+x.dataset.a+" added to cart")}
  else if(x=g("data-r")){S.cart.delete(x.dataset.r);render(false)}
  else if(e.target.closest("#bk")){S.cat=null;S.q="";render(true)}
  else if(x=g("data-i")){openSheet(x.dataset.i)}
  else if(e.target.closest("#ph")){sharePhone()}
  else if(e.target.closest("#cls")||e.target.id==="sheet"){closeSheet()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim();render(false)}});

load().then(raw=>{
  LET.forEach(l=>{DATA[l]=clean(raw[l])});
  [...SPD,...Object.keys(raw).filter(k=>!/^[A-Z]$/.test(k)&&!SPD.includes(k))].forEach(k=>{DATA[k]=clean(raw[k])});
  KEYS=Object.keys(DATA);
  ALL=[...new Set(Object.values(DATA).flat())];
  render(true);
}).catch(()=>{S.err=true;render(true)});
track();
</script>
</body>
</html>
